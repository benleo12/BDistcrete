# Installs the gentune package and nothing else:
#
#   pip install 'git+https://github.com/benleo12/BDistcrete@v2.0.1#subdirectory=analysis/release'
#
# The networks in models/, the examples and the generator scripts are not part of the package.
# They stay in the repository, and README.md says how to point the package at them.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gentune"
dynamic = ["version"]
description = "Continuous generator-parameter reweighting of e+e- events with the networks of Assi and Thaler, in numpy"
readme = "README.md"
license = "MIT"
authors = [{name = "Benoît Assi"}, {name = "Jesse Thaler"}]
# numpy is the only dependency, with the same floor as requirements.txt.
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.urls]
Repository = "https://github.com/benleo12/BDistcrete"

[tool.setuptools]
# Listed by hand, because examples/, tests/ and generators/ sit next to gentune/ and are not
# packages to install.
packages = ["gentune"]

[tool.setuptools.dynamic]
# One version for the package and the release, the one in VERSION.
version = {file = "VERSION"}
