# The analysis environment (tested on macOS arm64 and Linux x86_64 with Python 3.13).
# On a CUDA machine, install the CUDA build of PyTorch instead of the conda-forge CPU one.
name: bdistcrete
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.2
  - scipy=1.16
  - pytorch=2.7
  - matplotlib=3.10
  - pandas
  - pyyaml
  - tqdm
  - scikit-learn=1.6
  - pip
  - pip:
      - energyflow==1.3.2   # energy flow polynomials in compute_efps.py
